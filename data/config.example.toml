games = []                 # extra game process names on top of the built-ins
ignore = []                # extra processes to never treat as a game

[startup]                  # applied once when the daemon starts, never restored
# scheduler = "scx_flash"  # scx scheduler while no game runs (games switch back to it on exit)
# cpu_turbo = false        # true = on, false = off
# cpu_freq = "4.5G"        # any of: "4500M", "4.5G", "4500000K" - all the same
# cpu_pl1 = "125W"         # rapl long_term package limit, "125" works too
# cpu_pl2 = "181W"         # rapl short_term package limit

[defaults]                 # applied to any detected game with no [[game]] block
# scheduler = "scx_lavd"   # scx scheduler to load (scxctl list)
# cpu_governor = true      # toggle the performance governor + EPP (on by default)
# cpu_turbo = true
# cpu_freq = "5.1G"
# cpu_pl1 = "150W"
# cpu_pl2 = "200W"

# per-game overrides.
# path is matched as a substring of the process command line so an install folder works as well as an exe name.
# anything left out falls back to [defaults].

# [[game]]
# path = "Black Myth Wukong"
# scheduler = "scx_cake"
# cpu_pl1 = "150W"
#

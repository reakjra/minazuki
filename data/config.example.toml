# everything here adds to the built-in defaults.

games = []                 # extra game process names
ignore = []                # extra processes to never treat as a game
# scheduler = "scx_lavd"   # scx scheduler for any detected game (scxctl list)

[startup]                  # applied once when the daemon starts
# cpu_turbo = false        # true = on, false = off
# cpu_freq = "4.5G"        # any of: "4500M", "4.5G", "4500000K" — all the same

[schedulers]               # per-game override, matched on path substring
# "Black Myth Wukong" = "scx_bpfland"
